name: Release

# Pushing a tag v* runs the tests, builds, and moves the tag to a commit that also contains the
# build output (dist/, which is not on main), so that jsDelivr can serve the tag from GitHub:
#   https://cdn.jsdelivr.net/gh/numero-uno-jpn/rStats.js@v0.5.0/dist/rstats.js
# It then publishes to npm through npm's trusted publishing (OIDC, no token): the package's settings on
# npmjs.com name this repository and this workflow file as its trusted publisher.
# For the release steps see "Releasing" in CONTRIBUTING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to push the tag with the build output
  id-token: write # for npm trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check that the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run build
      - name: Move the tag to a commit with the build output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          # On a re-run the tag already contains this build
          git diff --cached --quiet || git commit -q -m "Build output for $GITHUB_REF_NAME"
          git tag -f "$GITHUB_REF_NAME"
          git push -f origin "refs/tags/$GITHUB_REF_NAME"
      - name: Publish to npm
        run: npm publish
