name: Pages

# Publishes https://numero-uno-jpn.github.io/rStats.js/: the repository rendered by Jekyll as before (README as the
# front page, the Markdown documents, demo/), plus the API reference generated by TypeDoc under api/. The reference is
# built from the latest release tag, so that it describes the version on npm; the rest comes from main.
# Requires Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write # to deploy
  id-token: write # for the deployment's OIDC token

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # the release tags
      - uses: actions/configure-pages@v6
      - name: Render the repository with Jekyll (as the legacy Pages build did)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the API reference from the latest release tag
        run: |
          tag=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          echo "API reference for $tag"
          git worktree add -q ../release "$tag"
          cd ../release
          npm ci --ignore-scripts
          npx --yes typedoc@0.28.20 --out ../api --name "rStats.js $tag"
          sudo mkdir -p "$GITHUB_WORKSPACE/_site/api"
          sudo cp -R ../api/. "$GITHUB_WORKSPACE/_site/api/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
